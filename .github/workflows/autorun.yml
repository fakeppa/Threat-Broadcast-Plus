name: Threat Broadcast

on:
  workflow_dispatch:
  schedule:
    # 每 4 小时运行一次（UTC）
    - cron: '0 20,0,4,8,12,16 * * *'

# 允许流水线把生成的页面 / 数据库提交回仓库
permissions:
  contents: write

# 避免手动触发与定时任务并发写仓库
concurrency:
  group: threat-broadcast
  cancel-in-progress: false

jobs:
  crawl-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # 供下面的必填检查与爬虫命令共同使用
      CRAWL_PWD: ${{ secrets.CRAWL_PWD }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check required secret
        run: |
          if [ -z "$CRAWL_PWD" ]; then
            echo "::error::缺少 CRAWL_PWD Secret。请在 Settings -> Secrets and variables -> Actions 中添加后再运行。"
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Crawl threat intelligence
        env:
          GTK: ${{ secrets.GTK }}
          MAIL_PASS: ${{ secrets.MAIL_PASS }}
          MAIL_USER: ${{ secrets.MAIL_USER }}
          MAIL_SMTP: ${{ secrets.MAIL_SMTP }}
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
          KIMI_API_KEY: ${{ secrets.KIMI_API_KEY }}
          KIMI_API_URL: ${{ secrets.KIMI_API_URL }}
          WECHAT_WEBHOOK: ${{ secrets.WECHAT_WEBHOOK }}
          SERVERCHAN_KEY: ${{ secrets.SERVERCHAN_KEY }}
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python main.py -g "$CRAWL_PWD" -t 60 \
            -mu "$MAIL_USER" \
            -ms "$MAIL_SMTP"

      - name: Commit and push generated page
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "chore: update threat broadcast $(date -u +'%Y-%m-%dT%H:%MZ')"
          git push
